{% extends 'catalogo/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow border-0">
            <div class="card-body">
                <span class="badge bg-info text-dark mb-2">{{ producto.categoria }}</span>
                <h2 class="card-title fw-bold mb-3">{{ producto.nombre }}</h2>
                <hr>
                <p class="fs-4 text-success fw-bold">Precio: ${{ producto.precio }} CLP</p>
                <p class="fs-6"><strong>Stock en Bodega:</strong> {{ producto.stock }} unidades</p>
                <p class="text-muted small">ID del Producto: {{ producto.id }}</p>
                <a href="{% url 'lista' %}" class="btn btn-secondary mt-3">Volver al Catálogo</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
