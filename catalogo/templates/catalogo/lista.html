{% extends 'catalogo/base.html' %}

{% block content %}
<h1 class="mb-4 text-center fw-bold">Catálogo de Productos</h1>
<p class="text-muted text-center mb-4">Total de registros: {{ productos|length }}</p>

<div class="row">
    {% for p in productos %}
    <div class="col-md-4 col-lg-3 mb-4">
        <div class="card h-100 shadow-sm border-0">
            <div class="card-body d-flex flex-column">
                <span class="badge bg-secondary mb-2 align-self-start">{{ p.categoria }}</span>
                <h5 class="card-title fs-6 fw-bold">{{ p.nombre }}</h5>
                <p class="card-text text-success fw-bold fs-5 mb-1">${{ p.precio }}</p>
                <p class="card-text text-muted small">Stock disponible: {{ p.stock }} u.</p>
                <a href="{% url 'detalle' p.id %}" class="btn btn-outline-primary btn-sm mt-auto">Ver Detalle</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
